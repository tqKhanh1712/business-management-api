<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 870" width="1080" height="870" style="background:#ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1020" height="65" rx="8" fill="url(#headerGrad)" filter="url(#cardShadow)"/>
  <text x="540" y="48" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">KIẾN TRÚC HỆ THỐNG QTKD - PHASE 2 (TUẦN 05)</text>
  <text x="540" y="68" text-anchor="middle" fill="#e0e7ff" font-size="13">Mô hình phân tầng ASP.NET Core Web API · Services · Entity Framework Core · PostgreSQL</text>

  <!-- ==================== LAYER 1: CLIENT ==================== -->
  <g transform="translate(0, 100)">
    <rect x="30" y="0" width="1020" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="45" y="12" width="120" height="26" rx="4" fill="#0284c7"/>
    <text x="105" y="29" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CLIENT LAYER</text>

    <!-- Components -->
    <rect x="230" y="14" width="310" height="46" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="385" y="36" text-anchor="middle" fill="#0369a1" font-size="14" font-weight="600">Swagger UI</text>
    <text x="385" y="51" text-anchor="middle" fill="#0284c7" font-size="11">https://localhost:&lt;port&gt;/swagger</text>

    <rect x="580" y="14" width="310" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="735" y="36" text-anchor="middle" fill="#b45309" font-size="14" font-weight="600">Postman / Browser</text>
    <text x="735" y="51" text-anchor="middle" fill="#d97706" font-size="11">HTTP Client Test Tool</text>
  </g>

  <!-- Connector 1: Client <--> API (Hai chiều) -->
  <line x1="540" y1="177" x2="540" y2="210" stroke="#64748b" stroke-width="2" marker-start="url(#arrowUp)" marker-end="url(#arrowDown)"/>
  <rect x="420" y="184" width="240" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="198" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">Request (HTTP GET) / Response (JSON)</text>

  <!-- ==================== LAYER 2: API (CONTROLLERS) ==================== -->
  <g transform="translate(0, 214)">
    <rect x="30" y="0" width="1020" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="45" y="12" width="120" height="26" rx="4" fill="#059669"/>
    <text x="105" y="29" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">API LAYER</text>

    <!-- Components -->
    <rect x="230" y="14" width="310" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="385" y="37" text-anchor="middle" fill="#065f46" font-size="14" font-weight="700">CustomersController</text>
    <text x="385" y="56" text-anchor="middle" fill="#047857" font-size="12">GET /api/customers</text>

    <rect x="580" y="14" width="310" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="735" y="37" text-anchor="middle" fill="#065f46" font-size="14" font-weight="700">ContractsController</text>
    <text x="735" y="56" text-anchor="middle" fill="#047857" font-size="12">GET /api/contracts/{id}</text>
  </g>

  <!-- Connector 2: API <--> Services (Hai chiều) -->
  <line x1="540" y1="304" x2="540" y2="337" stroke="#64748b" stroke-width="2" marker-start="url(#arrowUp)" marker-end="url(#arrowDown)"/>
  <rect x="430" y="311" width="220" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="325" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">Gọi Service (DI) / Trả về DTO</text>

  <!-- ==================== LAYER 3: SERVICE LAYER ==================== -->
  <g transform="translate(0, 341)">
    <rect x="30" y="0" width="1020" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="45" y="12" width="120" height="26" rx="4" fill="#2563eb"/>
    <text x="105" y="29" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SERVICE LAYER</text>

    <!-- Components -->
    <rect x="230" y="14" width="310" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="385" y="37" text-anchor="middle" fill="#1e40af" font-size="13.5" font-weight="700">ICustomerService / CustomerService</text>
    <text x="385" y="55" text-anchor="middle" fill="#3b82f6" font-size="11">Truy vấn &amp; chuyển đổi sang CustomerDto</text>

    <rect x="580" y="14" width="310" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="735" y="37" text-anchor="middle" fill="#1e40af" font-size="13.5" font-weight="700">IContractService / ContractService</text>
    <text x="735" y="55" text-anchor="middle" fill="#3b82f6" font-size="11">Truy vấn &amp; chuyển đổi sang ContractDto</text>
  </g>

  <!-- Connector 3: Services <--> Data Access (Hai chiều) -->
  <line x1="540" y1="431" x2="540" y2="464" stroke="#64748b" stroke-width="2" marker-start="url(#arrowUp)" marker-end="url(#arrowDown)"/>
  <rect x="415" y="438" width="250" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="452" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">Truy vấn LINQ / EF Core trả về Entity</text>

  <!-- ==================== LAYER 4: DATA ACCESS & DATABASE ==================== -->
  <g transform="translate(0, 468)">
    <rect x="30" y="0" width="1020" height="375" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Top Header Badge -->
    <rect x="45" y="12" width="220" height="26" rx="4" fill="#7c3aed"/>
    <text x="155" y="29" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">DATA LAYER &amp; DATABASE</text>

    <!-- Box 1: DbContext & Migrations -->
    <rect x="45" y="50" width="265" height="305" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <rect x="45" y="50" width="265" height="32" rx="6" fill="#fbcfe8"/>
    <text x="177" y="71" text-anchor="middle" fill="#9d174d" font-size="14" font-weight="700">QtkdDbContext</text>
    
    <text x="60" y="103" fill="#334155" font-size="12" font-weight="600">• Fluent API Mapping:</text>
    <text x="75" y="122" fill="#475569" font-size="11">- Enum dạng chuỗi (HasConversion)</text>
    <text x="75" y="139" fill="#475569" font-size="11">- ContractNo đánh Unique Index</text>
    <text x="75" y="156" fill="#475569" font-size="11">- Contract → Customer (Restrict)</text>
    <text x="75" y="173" fill="#475569" font-size="11">- PriceItem → PriceList (Cascade)</text>
    
    <text x="60" y="200" fill="#334155" font-size="12" font-weight="600">• Seed Data (HasData):</text>
    <text x="75" y="219" fill="#475569" font-size="11">- 2 Customers (Minh Phát, Hải Long)</text>
    <text x="75" y="236" fill="#475569" font-size="11">- 1 Contract Draft (HD-2026-018)</text>
    <text x="75" y="253" fill="#475569" font-size="11">- 1 PriceList, 2 PriceItems</text>
    
    <text x="60" y="280" fill="#334155" font-size="12" font-weight="600">• Migration đã sinh:</text>
    <text x="75" y="299" fill="#9d174d" font-size="12" font-weight="700">InitialCreate</text>
    <text x="75" y="316" fill="#64748b" font-size="10.5">(Gồm Schema 4 bảng &amp; Seed Data)</text>

    <!-- Box 2: Domain Entities & Relationships (Chi tiết chuẩn) -->
    <rect x="325" y="50" width="425" height="305" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="325" y="50" width="425" height="32" rx="6" fill="#fde68a"/>
    <text x="537" y="71" text-anchor="middle" fill="#92400e" font-size="14" font-weight="700">Domain Entities (Mô hình thực thể)</text>
    
    <!-- Customer Entity -->
    <rect x="340" y="94" width="160" height="74" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="420" y="113" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Customer</text>
    <text x="350" y="131" fill="#475569" font-size="10.5">• Id (PK): int</text>
    <text x="350" y="146" fill="#475569" font-size="10.5">• Name: string</text>
    <text x="350" y="160" fill="#475569" font-size="10.5">• Status: CustomerStatus</text>

    <!-- Quan hệ Customer 1 - N Contract -->
    <line x1="500" y1="131" x2="570" y2="131" stroke="#b45309" stroke-width="2"/>
    <text x="508" y="125" fill="#b45309" font-size="11" font-weight="700">1</text>
    <text x="558" y="125" fill="#b45309" font-size="11" font-weight="700">N</text>
    <text x="535" y="147" text-anchor="middle" fill="#b45309" font-size="9" font-weight="600">FK: CustomerId</text>

    <!-- Contract Entity -->
    <rect x="570" y="94" width="165" height="74" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="652" y="113" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Contract</text>
    <text x="578" y="129" fill="#475569" font-size="10">• Id (PK): int</text>
    <text x="578" y="142" fill="#b45309" font-size="10" font-weight="600">• CustomerId (FK): int</text>
    <text x="578" y="155" fill="#475569" font-size="9.5">• ContractNo (Unique)</text>
    <text x="578" y="166" fill="#475569" font-size="9">• Dates, Status: ContractStatus</text>

    <!-- PriceList Entity -->
    <rect x="340" y="180" width="160" height="74" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="420" y="199" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">PriceList</text>
    <text x="350" y="217" fill="#475569" font-size="10.5">• Id (PK): int</text>
    <text x="350" y="232" fill="#475569" font-size="10.5">• Name: string</text>
    <text x="350" y="246" fill="#475569" font-size="10">• EffectiveDate: DateOnly</text>

    <!-- Quan hệ PriceList 1 - N PriceItem -->
    <line x1="500" y1="217" x2="570" y2="217" stroke="#b45309" stroke-width="2"/>
    <text x="508" y="211" fill="#b45309" font-size="11" font-weight="700">1</text>
    <text x="558" y="211" fill="#b45309" font-size="11" font-weight="700">N</text>
    <text x="535" y="233" text-anchor="middle" fill="#b45309" font-size="9" font-weight="600">FK: PriceListId</text>

    <!-- PriceItem Entity (ĐÃ SỬA: ServiceCode) -->
    <rect x="570" y="180" width="165" height="74" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="652" y="199" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">PriceItem</text>
    <text x="578" y="217" fill="#b45309" font-size="9.5" font-weight="700">• PK: (PriceListId, ServiceCode)</text>
    <text x="578" y="232" fill="#475569" font-size="10.5">• ServiceCode: string</text>
    <text x="578" y="246" fill="#475569" font-size="10.5">• UnitPrice: decimal</text>

    <!-- Enums badge (ĐÃ SỬA: Ghi đầy đủ 5 trạng thái không có dấu ...) -->
    <rect x="340" y="266" width="395" height="74" rx="4" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
    <text x="537" y="284" text-anchor="middle" fill="#854d0e" font-size="11" font-weight="700">Enums (Lưu dạng chuỗi - HasConversion):</text>
    <text x="537" y="303" text-anchor="middle" fill="#713f12" font-size="10.5">• CustomerStatus: Active, Inactive</text>
    <text x="537" y="323" text-anchor="middle" fill="#713f12" font-size="10.5">• ContractStatus: Draft, PendingApproval, RevisionRequested, Approved, Rejected</text>

    <!-- Box 3: PostgreSQL Database (ĐÃ SỬA: Tách bạch rõ 4 bảng) -->
    <rect x="765" y="50" width="270" height="305" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="765" y="50" width="270" height="32" rx="6" fill="#ddd6fe"/>
    <text x="900" y="71" text-anchor="middle" fill="#5b21b6" font-size="14" font-weight="700">PostgreSQL Database</text>
    
    <text x="778" y="103" fill="#334155" font-size="12" font-weight="600">• Database: qtkd_dev | Port: 5432</text>
    <text x="778" y="123" fill="#334155" font-size="12" font-weight="600">• Provider: Npgsql.EFCore</text>
    
    <text x="778" y="148" fill="#334155" font-size="12" font-weight="700">• 4 Bảng vật lý lưu trữ:</text>
    <rect x="778" y="156" width="245" height="184" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    
    <text x="788" y="174" fill="#5b21b6" font-size="11" font-weight="700">1. Customers</text>
    <text x="800" y="189" fill="#475569" font-size="10">PK: Id | Name, Status</text>
    
    <text x="788" y="209" fill="#5b21b6" font-size="11" font-weight="700">2. Contracts</text>
    <text x="800" y="224" fill="#475569" font-size="10">PK: Id | FK: CustomerId</text>
    <text x="800" y="238" fill="#475569" font-size="9.5">ContractNo (Unique) | Dates, Status</text>
    
    <text x="788" y="258" fill="#5b21b6" font-size="11" font-weight="700">3. PriceLists</text>
    <text x="800" y="273" fill="#475569" font-size="10">PK: Id | Name, EffectiveDate</text>
    
    <text x="788" y="293" fill="#5b21b6" font-size="11" font-weight="700">4. PriceItems</text>
    <text x="800" y="308" fill="#475569" font-size="10">PK kép: (PriceListId, ServiceCode)</text>
    <text x="800" y="323" fill="#475569" font-size="10">FK: PriceListId | UnitPrice</text>
  </g>
</svg>
