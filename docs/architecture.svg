<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background:#ffffff; font-family: Segoe UI, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="860" height="60" rx="8" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="450" y="58" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">KIẾN TRÚC HỆ THỐNG QTKD - TUẦN 05</text>

  <!-- Layer 1: Client -->
  <rect x="50" y="110" width="800" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="140" fill="#0f172a" font-size="16" font-weight="bold">Client Layer</text>
  <rect x="280" y="125" width="220" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="390" y="150" text-anchor="middle" fill="#0369a1" font-size="14" font-weight="600">Swagger UI (/swagger)</text>
  <rect x="530" y="125" width="180" height="40" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="150" text-anchor="middle" fill="#b45309" font-size="14" font-weight="600">Postman / Browser</text>

  <!-- Arrow -->
  <line x1="450" y1="180" x2="450" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="200" fill="#64748b" font-size="12">HTTP GET</text>

  <!-- Layer 2: API (Controllers) -->
  <rect x="50" y="210" width="800" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="240" fill="#0f172a" font-size="16" font-weight="bold">API Layer</text>
  <rect x="200" y="230" width="260" height="50" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="255" text-anchor="middle" fill="#065f46" font-size="14" font-weight="600">CustomersController</text>
  <text x="330" y="272" text-anchor="middle" fill="#047857" font-size="12">GET /api/customers</text>
  <rect x="490" y="230" width="260" height="50" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="255" text-anchor="middle" fill="#065f46" font-size="14" font-weight="600">ContractsController</text>
  <text x="620" y="272" text-anchor="middle" fill="#047857" font-size="12">GET /api/contracts/{id}</text>

  <!-- Arrow -->
  <line x1="450" y1="295" x2="450" y2="325" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="315" fill="#64748b" font-size="12">Service Call</text>

  <!-- Layer 3: Services Layer -->
  <rect x="50" y="325" width="800" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="355" fill="#0f172a" font-size="16" font-weight="bold">Service Layer</text>
  <rect x="200" y="345" width="260" height="45" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="372" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="600">ICustomerService / CustomerService</text>
  <rect x="490" y="345" width="260" height="45" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="372" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="600">IContractService / ContractService</text>

  <!-- Arrow -->
  <line x1="450" y1="405" x2="450" y2="435" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="425" fill="#64748b" font-size="12">EF Core / LINQ</text>

  <!-- Layer 4: Data Access & Entities -->
  <rect x="50" y="435" width="800" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="465" fill="#0f172a" font-size="16" font-weight="bold">Data Layer &amp; Database</text>
  
  <rect x="180" y="455" width="180" height="110" rx="5" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="270" y="480" text-anchor="middle" fill="#9d174d" font-size="14" font-weight="bold">QtkdDbContext</text>
  <text x="270" y="505" text-anchor="middle" fill="#475569" font-size="12">Fluent API Mappings</text>
  <text x="270" y="525" text-anchor="middle" fill="#475569" font-size="12">Seed Data (HasData)</text>
  <text x="270" y="545" text-anchor="middle" fill="#475569" font-size="12">Migrations History</text>

  <rect x="390" y="455" width="220" height="110" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="480" text-anchor="middle" fill="#b45309" font-size="14" font-weight="bold">Domain Entities</text>
  <text x="500" y="503" text-anchor="middle" fill="#334155" font-size="12">Customer (1) ──── (N) Contract</text>
  <text x="500" y="525" text-anchor="middle" fill="#334155" font-size="12">PriceList (1) ──── (N) PriceItem</text>
  <text x="500" y="547" text-anchor="middle" fill="#64748b" font-size="11">Enums: CustomerStatus, ContractStatus</text>

  <rect x="640" y="455" width="180" height="110" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="485" text-anchor="middle" fill="#5b21b6" font-size="14" font-weight="bold">PostgreSQL Database</text>
  <text x="730" y="510" text-anchor="middle" fill="#6b21a8" font-size="13">qtkd_dev</text>
  <text x="730" y="535" text-anchor="middle" fill="#475569" font-size="12">Npgsql Provider</text>
</svg>
